  <style>
    body {

    .column p {

      line-height: 1.6;
    }
    a {

      text-decoration: none;
      font-weight: bold;
    }
    a:hover {

    }

      margin-top: 20px;
    }
    .image-section img {
      width: 500px;
      max-width: 90%;
      border-radius: 8px;
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
      }
      .column {
        width: 80%;
        margin-bottom: 20px;
        text-align: center;
